    update(px,py){ this.hitbox.x=this.initialX-px; this.hitbox.y=this.initialY-py; }
    renderGround(ctx,sheet,showHitboxes){
        const hb=this.hitbox;
        if(!this.active||this.type==="WALL"||this.type==="START_WALL"||this.type==="KILL_BLOCK") return;
        if(hb.x>-hb.w&&hb.y>-hb.h&&hb.x<SCREEN_WIDTH&&hb.y<SCREEN_HEIGHT){
            const sx=(this.tileNum-1)*17,sy=(this.tileType-1)*17;
            const rx=Math.round(hb.x),ry=Math.round(hb.y);
            const cx=rx+hb.w/2,cy=ry+hb.h/2;
            ctx.save();ctx.translate(cx,cy);ctx.rotate(this.rot*Math.PI/2);
            ctx.drawImage(sheet,sx,sy,17,17,-hb.w/2,-hb.h/2,hb.w,hb.h);
            ctx.restore();
            if(showHitboxes){
                if(this.type==="ICE"  ){ctx.strokeStyle='rgb(255,255,0)';ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);}
                if(this.type==="START"){ctx.strokeStyle='rgb(255,255,0)';ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);}

        if(!this.active||this.type!=="WALL"&&this.type!=="START_WALL"&&this.type!=="KILL_BLOCK") return;
        if(hb.x>-hb.w&&hb.y>-hb.h&&hb.x<SCREEN_WIDTH&&hb.y<SCREEN_HEIGHT){
            const rx=Math.round(hb.x),ry=Math.round(hb.y);
            ctx.save();ctx.globalAlpha=50/255;ctx.fillStyle='black';
            ctx.fillRect(rx-10,ry+10,hb.w,hb.h);

        }
    }
    render(ctx,sheet,showHitboxes){
        const hb=this.hitbox;
        if(!this.active||this.type!=="WALL"&&this.type!=="START_WALL"&&this.type!=="KILL_BLOCK") return;
        if(hb.x>-hb.w&&hb.y>-hb.h&&hb.x<SCREEN_WIDTH&&hb.y<SCREEN_HEIGHT){

                if(this.type==="WALL"      ){ctx.strokeStyle='rgb(255,0,0)';  ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);}
                if(this.type==="START_WALL"){ctx.strokeStyle='rgb(255,128,0)';ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);}
                if(this.type==="KILL_BLOCK"){ctx.strokeStyle='rgb(255,255,255)';ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);}
            }
        }
    }
}

class Car {
    constructor(){
        this.xVel=0; this.yVel=0;
        this.drawDir=270;
        this.xPos=INITIAL_CAR_X;
        this.yPos=INITIAL_CAR_Y;
        this.visual={x:SCREEN_WM-Math.floor(CAR_WIDTH/2),y:SCREEN_HM-Math.floor(CAR_HEIGHT/2),w:CAR_WIDTH,h:CAR_HEIGHT};
        this.hitbox={x:SCREEN_WM-Math.floor(CAR_WIDTH/2),y:SCREEN_HM-Math.floor(CAR_HEIGHT/2),w:50,h:50};
        this.mouseX=0; this.mouseY=0;
    }
    reset(){
        this.xPos=INITIAL_CAR_X; this.yPos=INITIAL_CAR_Y;
        this.xVel=0; this.yVel=0; this.drawDir=270;
    }
    resize(){
        this.visual.x=SCREEN_WM-Math.floor(CAR_WIDTH/2);
        this.visual.y=SCREEN_HM-Math.floor(CAR_HEIGHT/2);
        this.hitbox.x=SCREEN_WM-Math.floor(CAR_WIDTH/2);
        this.hitbox.y=SCREEN_HM-Math.floor(CAR_HEIGHT/2);
    }
    updateMovement(mx,my){
        const ox=mx-(SCREEN_WM-Math.floor(CAR_WIDTH/2));
        const oy=my-(SCREEN_HM-Math.floor(CAR_HEIGHT/2));
        let dx=ox/900, dy=oy/900;
        if(dx> ACCELERATION) dx= ACCELERATION;
        if(dy> ACCELERATION) dy= ACCELERATION;
        if(dx<-ACCELERATION) dx=-ACCELERATION;
        if(dy<-ACCELERATION) dy=-ACCELERATION;
        this.xVel+=dx; this.yVel+=dy;
        this.drawDir=Math.atan2(dy,dx)*180/Math.PI+90;
    }
    updatePosition(tiles){
        let onIce=false;
        const hb=this.hitbox;
        const hbResetX=SCREEN_WM-Math.floor(CAR_WIDTH/2);
        const hbResetY=SCREEN_HM-Math.floor(CAR_HEIGHT/2);

        for(let i=0;i<TILE_GRID_HEIGHT;i++){
            for(let j=0;j<TILE_GRID_WIDTH;j++){
                const t=tiles[i][j];
                if(!t.active||!hasIntersection(hb,t.hitbox)) continue;
                if(t.type==="ICE") onIce=true;
                if(t.type==="END"&&!finish){
                    finish=true;
                    finishTick=performance.now();
                    finishTime=(finishTick-gameStartTime-3000)/1000;
                }
                if(t.type==="KILL_BLOCK"){
                    this.xPos=INITIAL_CAR_X;this.yPos=INITIAL_CAR_Y;
                    this.xVel=0;this.yVel=0;
                    finish=false;gameStartTime=performance.now();
                    startWallDeactivated=false;
                }
            }
        }
        {
            let anyVoid=false,allVoid=true;
            for(let i=0;i<TILE_GRID_HEIGHT;i++)
                for(let j=0;j<TILE_GRID_WIDTH;j++){
                    const t=tiles[i][j];
                    if(hasIntersection(hb,t.hitbox)){
                        if(t.active&&t.type==="VOID") anyVoid=true;
                        else allVoid=false;
                    }
                }
            if(anyVoid&&allVoid){
                this.xPos=INITIAL_CAR_X;this.yPos=INITIAL_CAR_Y;
                this.xVel=0;this.yVel=0;
                finish=false;gameStartTime=performance.now();
                startWallDeactivated=false;
            }
        }

        if(onIce){this.xVel*=FRICTION;this.yVel*=FRICTION;}
        else{this.xVel*=0.9;this.yVel*=0.9;}
        if(Math.abs(this.xVel)<0.05) this.xVel=0;
        if(Math.abs(this.yVel)<0.05) this.yVel=0;
        let xHit=false,yHit=false;
        this.hitbox.x=hbResetX;this.hitbox.y=hbResetY;
        const xSteps=Math.ceil(Math.abs(this.xVel));
        const xDir=Math.sign(this.xVel);
        for(let i=0;i<xSteps;i++){
            this.hitbox.x+=xDir;
            for(let r=0;r<TILE_GRID_HEIGHT;r++)
                for(let c=0;c<TILE_GRID_WIDTH;c++){
                    const t=tiles[r][c];
                    if(t.active&&(t.type==="WALL"||t.type==="START_WALL")&&hasIntersection(this.hitbox,t.hitbox)) xHit=true;
                }
        }
        this.hitbox.x=hbResetX;this.hitbox.y=hbResetY;
        const ySteps=Math.ceil(Math.abs(this.yVel));
        const yDir=Math.sign(this.yVel);
        for(let i=0;i<ySteps;i++){
            this.hitbox.y+=yDir;
            for(let r=0;r<TILE_GRID_HEIGHT;r++)
                for(let c=0;c<TILE_GRID_WIDTH;c++){
                    const t=tiles[r][c];
                    if(t.active&&(t.type==="WALL"||t.type==="START_WALL")&&hasIntersection(this.hitbox,t.hitbox)) yHit=true;
                }
        }
        this.hitbox.x=hbResetX;this.hitbox.y=hbResetY;
        if(xHit) this.xVel*=-0.4;
        if(yHit) this.yVel*=-0.4;
        this.xPos+=this.xVel;this.yPos+=this.yVel;
    }
    update(mx,my,tiles){ this.updateMovement(mx,my); this.updatePosition(tiles); this.mouseX=mx; this.mouseY=my; }
    render(ctx,carImg,showHitboxes){
        const v=this.visual;
        const SHADOW_OFFSET=5;
        const scx=v.x-SHADOW_OFFSET+CAR_WIDTH/2, scy=v.y+SHADOW_OFFSET+CAR_HEIGHT/2-10;
        ctx.save();
        ctx.globalAlpha=50/255;
        ctx.filter='brightness(0)';
        ctx.translate(scx,scy);
        ctx.rotate(this.drawDir*Math.PI/180);
        ctx.drawImage(carImg,-CAR_WIDTH/2,-(CAR_HEIGHT/2-10),CAR_WIDTH,CAR_HEIGHT);
        ctx.restore();
        const cx=v.x+CAR_WIDTH/2, cy=v.y+CAR_HEIGHT/2-10;
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(this.drawDir*Math.PI/180);
        ctx.drawImage(carImg,-CAR_WIDTH/2,-(CAR_HEIGHT/2-10),CAR_WIDTH,CAR_HEIGHT);
        ctx.restore();
        if(showHitboxes){
            const hb=this.hitbox;
            ctx.strokeStyle='rgb(255,0,0)';
            ctx.strokeRect(hb.x,hb.y,hb.w,hb.h);
            const hcx=hb.x+hb.w/2, hcy=hb.y+hb.h/2;
            ctx.strokeStyle='rgb(0,0,255)';
            ctx.beginPath();
            ctx.moveTo(hcx,hcy);
            ctx.lineTo(this.mouseX,this.mouseY);
            ctx.stroke();
            if(this.xVel!==0||this.yVel!==0){
                const mouseLen=Math.sqrt((this.mouseX-hcx)**2+(this.mouseY-hcy)**2);
                const velLen=Math.sqrt(this.xVel*this.xVel+this.yVel*this.yVel);
                ctx.strokeStyle='rgb(0,255,255)';
                ctx.beginPath();
                ctx.moveTo(hcx,hcy);
                ctx.lineTo(hcx+(this.xVel/velLen)*mouseLen,hcy+(this.yVel/velLen)*mouseLen);
                ctx.stroke();
            }
        }
    }
}

class Background {
    constructor(){
        this.bgType=1;
        this.initCarX=INITIAL_CAR_X;
        this.initCarY=INITIAL_CAR_Y;
        this.bw=0; this.bh=0; this.rects=[];
        this.rebuild();
    }
    setType(t){
        this.bgType=t;
        this.initCarX=INITIAL_CAR_X;
        this.initCarY=INITIAL_CAR_Y;
    }
    rebuild(){
        this.bw=Math.ceil(SCREEN_WIDTH/TILE_SIZE)+1;
        this.bh=Math.ceil(SCREEN_HEIGHT/TILE_SIZE)+1;
        this.rects=[];
        for(let i=0;i<this.bh;i++){
            this.rects[i]=[];
            for(let j=0;j<this.bw;j++)
                this.rects[i][j]={x:j*TILE_SIZE,y:i*TILE_SIZE,w:TILE_SIZE,h:TILE_SIZE};
        }
    }
    update(px,py){
        const offX=((Math.trunc(px-this.initCarX)%TILE_SIZE)+TILE_SIZE)%TILE_SIZE;
        const offY=((Math.trunc(py-this.initCarY)%TILE_SIZE)+TILE_SIZE)%TILE_SIZE;
        for(let i=0;i<this.bh;i++)
            for(let j=0;j<this.bw;j++){
                this.rects[i][j].x=j*TILE_SIZE-offX;
                this.rects[i][j].y=i*TILE_SIZE-offY;
            }
    }
    render(ctx,sheet){
        const srcX=this.bgType===2?9*17:7*17,srcY=this.bgType===2?17:0;
        for(let i=0;i<this.bh;i++)
            for(let j=0;j<this.bw;j++){
                const r=this.rects[i][j];
                ctx.drawImage(sheet,srcX,srcY,17,17,r.x,r.y,r.w,r.h);
            }
    }
}

function renderText(ctx,textSheet,text,x,y,size){
    if(size===undefined) size=2;
    const charW=4,charH=7;
    for(let i=0;i<text.length;i++){
        const ch=text[i];
        let col=0,row=0;
        if(ch==='A'){col=1;}  if(ch==='B'){col=2;}  if(ch==='C'){col=3;}
        if(ch==='D'){col=4;}  if(ch==='E'){col=5;}  if(ch==='F'){col=6;}
        if(ch==='G'){col=7;}  if(ch==='H'){col=8;}  if(ch==='I'){col=9;}
        if(ch==='J'){col=10;} if(ch==='K'){col=11;} if(ch==='L'){col=12;}
        if(ch==='M'){col=13;} if(ch==='N'){col=14;} if(ch==='O'){col=15;}
        if(ch==='P'){col=16;} if(ch==='Q'){col=17;} if(ch==='R'){col=18;}
        if(ch==='S'){col=19;} if(ch==='T'){col=20;} if(ch==='U'){col=21;}
        if(ch==='V'){col=22;} if(ch==='W'){col=23;} if(ch==='X'){col=24;}
        if(ch==='Y'){col=25;} if(ch==='Z'){col=26;}
        if(ch==='1'){col=1;row=18;} if(ch==='2'){col=2;row=18;} if(ch==='3'){col=3;row=18;}
        if(ch==='4'){col=4;row=18;} if(ch==='5'){col=5;row=18;} if(ch==='6'){col=6;row=18;}
        if(ch==='7'){col=7;row=18;} if(ch==='8'){col=8;row=18;} if(ch==='9'){col=9;row=18;}
        if(ch==='0'){col=10;row=18;}
        if(ch==='?'){col=1;row=26;} if(ch==='!'){col=2;row=26;} if(ch==='.'){col=3;row=26;}
        if(ch===','){col=4;row=26;} if(ch===':'){col=5;row=26;} if(ch===';'){col=6;row=26;}
        if(col===0) continue;
        const srcX=(col-1)*5,srcY=row;
        const dw=charW*3*size,dh=charH*3*size;
        const dx=x+i*(dw+3),dy=y;
        ctx.drawImage(textSheet,srcX,srcY,charW,charH,dx,dy,dw,dh);
    }
}

function renderButton(ctx,btnSheet,textSheet,type,bx,by,bw,bh,text){
    let sx=0,sy=0,sw=40,sh=20;
    if(type===2){sx=40;sy=0;sw=20;sh=20;}
    // Shadow
    ctx.save();
    ctx.globalAlpha=80/255;
    ctx.filter='brightness(0)';
    ctx.drawImage(btnSheet,sx,sy,sw,sh,bx-5,by+5,bw,bh);
    ctx.restore();
    // Button
    ctx.drawImage(btnSheet,sx,sy,sw,sh,bx,by,bw,bh);
    // Text
    if(text&&text.length>0){
        const size=2;
        const charW=4,charH=7;
        const tw=text.length*(charW*3*size+3);
        const th=charH*3*size;
        const tx=bx+bw/2-tw/2,ty=by+bh/2-th/2;
        renderText(ctx,textSheet,text,tx,ty,size);
    }
}

canvas.addEventListener('touchstart',updateFromTouch,{passive:false});
canvas.addEventListener('touchmove',updateFromTouch,{passive:false});
canvas.addEventListener('mousedown',()=>{mouseJustPressed=true;});
canvas.addEventListener('touchstart',()=>{mouseJustPressed=true;},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Shift') showHitboxes=true;});
document.addEventListener('keyup',  e=>{if(e.key==='Shift') showHitboxes=false;});

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Cannot load: '+src));i.src=src;});}

ctx.fillStyle='#222'; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
ctx.fillStyle='#fff'; ctx.font='32px monospace'; ctx.fillText('Loading textures...',60,SCREEN_HM);

Promise.all([
    loadImg('textures/tiles.png'),
    loadImg('textures/car.png'),
    loadImg('textures/title.png'),
    loadImg('textures/text.png'),
    loadImg('textures/buttons.png')
]).then(([sheet,carImg,titleImg,textSheet,btnSheet])=>{
    // Build tile grid (positions fixed at init, types set by loadLevel)
    const tiles=[];
    for(let i=0;i<TILE_GRID_HEIGHT;i++){
        tiles[i]=[];
        for(let j=0;j<TILE_GRID_WIDTH;j++){
            const t=new Tile();
            t.init(j*TILE_SIZE,i*TILE_SIZE);
            tiles[i][j]=t;
        }
    }

    function doSetTile(i,j){
        const make=(r,c)=>{
            if(r<0||r>=TILE_GRID_HEIGHT||c<0||c>=TILE_GRID_WIDTH) return {active:false,type:"N/A"};
            return {active:tiles[r][c].active, type:tiles[r][c].type};
        };
        tiles[i][j].setTile(
            make(i-1,j),make(i+1,j),make(i,j-1),make(i,j+1),
            make(i-1,j-1),make(i-1,j+1),make(i+1,j-1),make(i+1,j+1)
        );
    }

    function loadLevel(){
        const map=LEVEL_MAPS[currentLevel];
        for(let i=0;i<TILE_GRID_HEIGHT;i++){
            for(let j=0;j<TILE_GRID_WIDTH;j++){
                const v=map[i][j];
                if(v===1){tiles[i][j].active=true;tiles[i][j].type="WALL";}
                else if(v===2){tiles[i][j].active=true;tiles[i][j].type="ICE";}
                else if(v===3){tiles[i][j].active=true;tiles[i][j].type="START";}
                else if(v===4){tiles[i][j].active=true;tiles[i][j].type="END";}
                else if(v===5){tiles[i][j].active=true;tiles[i][j].type="START_WALL";}
                else if(v===6){tiles[i][j].active=true;tiles[i][j].type="KILL_BLOCK";}
                else if(v===7){tiles[i][j].active=true;tiles[i][j].type="VOID";}
                else{tiles[i][j].active=false;tiles[i][j].type="";}
            }
        }
        for(let i=0;i<TILE_GRID_HEIGHT;i++)
            for(let j=0;j<TILE_GRID_WIDTH;j++)
                doSetTile(i,j);
    }

    function applyStartWallActivate(){
        for(let i=0;i<TILE_GRID_HEIGHT;i++)
            for(let j=0;j<TILE_GRID_WIDTH;j++){
                if(tiles[i][j].type==="START") tiles[i][j].type="START_WALL";
                doSetTile(i,j);
            }
    }
    function applyStartWallDeactivate(){
        for(let i=0;i<TILE_GRID_HEIGHT;i++)
            for(let j=0;j<TILE_GRID_WIDTH;j++){
                if(tiles[i][j].type==="START_WALL") tiles[i][j].type="START";
                doSetTile(i,j);
            }
    }

    const player=new Car();
    const bg=new Background();
    const menuBg=new MenuBackground();

    // Layout helpers (computed dynamically so they respond to resize)
    function getStartBtn(){
        const bw=40*6,bh=20*6;
        return {bx:Math.floor(SCREEN_WM-bw/2),by:Math.floor(SCREEN_HM-bh/2),bw,bh};
    }
    function getLevelBtn(i){
        const size=20*6,gap=20,step=size+gap,n=3;
        const lx=Math.floor(SCREEN_WM-(n*step-gap)/2+size/2+i*step);
        return {bx:lx-size/2,by:Math.floor(SCREEN_HM-size/2),bw:size,bh:size};
    }
    function inRect(mx,my,bx,by,bw,bh){return mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh;}

    window.addEventListener('resize',()=>{
        resizeCanvas();
        INITIAL_CAR_X=800-Math.floor(CAR_WIDTH/2)+LEVEL_START_X[currentLevel];
        INITIAL_CAR_Y=450-Math.floor(CAR_HEIGHT/2)+LEVEL_START_Y[currentLevel];
        bg.rebuild();
        menuBg.rebuild();
        player.resize();
    });

    function loop(){
        const mjp=mouseJustPressed;
        mouseJustPressed=false;

        if(page==='MENU'){
            menuBg.update();

            // Check start button click
            const sb=getStartBtn();
            if(mjp&&inRect(mouseX,mouseY,sb.bx,sb.by,sb.bw,sb.bh)) page='LEVELS';

            ctx.fillStyle='#000';ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
            menuBg.render(ctx,sheet);
            renderButton(ctx,btnSheet,textSheet,1,sb.bx,sb.by,sb.bw,sb.bh,'');

            // Title shadow
            const tx=Math.floor(SCREEN_WM-TITLE_WIDTH/2),ty=100;
            ctx.save();ctx.globalAlpha=80/255;ctx.filter='brightness(0)';
            ctx.drawImage(titleImg,tx-5,ty+5,TITLE_WIDTH,TITLE_HEIGHT);
            ctx.restore();
            ctx.drawImage(titleImg,tx,ty,TITLE_WIDTH,TITLE_HEIGHT);

        } else if(page==='LEVELS'){
            menuBg.update();

            for(let i=0;i<3;i++){
                const lb=getLevelBtn(i);
                if(mjp&&inRect(mouseX,mouseY,lb.bx,lb.by,lb.bw,lb.bh)){
                    currentLevel=i;
                    INITIAL_CAR_X=800-Math.floor(CAR_WIDTH/2)+LEVEL_START_X[i];
                    INITIAL_CAR_Y=450-Math.floor(CAR_HEIGHT/2)+LEVEL_START_Y[i];
                    levelLoaded=false;
                    page='GAME';
                }
            }

            ctx.fillStyle='#000';ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
            menuBg.render(ctx,sheet);
            for(let i=0;i<3;i++){
                const lb=getLevelBtn(i);
                renderButton(ctx,btnSheet,textSheet,2,lb.bx,lb.by,lb.bw,lb.bh,String(i+1));
            }

        } else if(page==='GAME'){
            if(!levelLoaded){
                loadLevel();
                bg.setType(LEVEL_BACKGROUND[currentLevel]);
                INITIAL_CAR_X=800-Math.floor(CAR_WIDTH/2)+LEVEL_START_X[currentLevel];
                INITIAL_CAR_Y=450-Math.floor(CAR_HEIGHT/2)+LEVEL_START_Y[currentLevel];
                player.reset();
                startWallDeactivated=false;
                gameStartTime=performance.now();
                finish=false;
                levelLoaded=true;
            }

            if(!startWallDeactivated){
                applyStartWallActivate();
                if(performance.now()-gameStartTime>=3000){
                    applyStartWallDeactivate();
                    startWallDeactivated=true;
                }
            }

            player.update(mouseX,mouseY,tiles);
            for(let i=0;i<TILE_GRID_HEIGHT;i++)
                for(let j=0;j<TILE_GRID_WIDTH;j++)
                    tiles[i][j].update(player.xPos,player.yPos);
            bg.update(player.xPos,player.yPos);

            ctx.fillStyle='rgb(0,0,0)';ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
            bg.render(ctx,sheet);
            for(let i=0;i<TILE_GRID_HEIGHT;i++)
                for(let j=0;j<TILE_GRID_WIDTH;j++)
                    tiles[i][j].renderGround(ctx,sheet,showHitboxes);
            for(let i=0;i<TILE_GRID_HEIGHT;i++)
                for(let j=0;j<TILE_GRID_WIDTH;j++)
                    tiles[i][j].renderShadow(ctx);
            for(let i=0;i<TILE_GRID_HEIGHT;i++)
                for(let j=0;j<TILE_GRID_WIDTH;j++)
                    tiles[i][j].render(ctx,sheet,showHitboxes);
            player.render(ctx,carImg,showHitboxes);

            if(finish){
                const text='YOU FINISHED IN '+finishTime.toFixed(2)+' SECONDS!';
                const size=2,charW=4,charH=7;
                const tw=text.length*(charW*3*size+3);
                const th=charH*3*size;
                renderText(ctx,textSheet,text,SCREEN_WM-tw/2,(SCREEN_HM-th/2)-SCREEN_HM/2,size);
                if(performance.now()-finishTick>=3000){
                    page='LEVELS';
                    finish=false;
                }
            }
        }

        requestAnimationFrame(loop);
    }
    loop();
}).catch(err=>{
    console.error(err);
    ctx.fillStyle='#222'; ctx.fillRect(0,0,SCREEN_WIDTH,SCREEN_HEIGHT);
    ctx.fillStyle='#f66'; ctx.font='24px monospace';
    const lines=(err.stack||err.toString()).split('\n');
    lines.forEach((l,i)=>ctx.fillText(l.slice(0,90),40,80+i*30));
});
</script>
</body>
</html>
